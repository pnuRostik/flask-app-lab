{% extends "base.html" %}

{% block title %}Видалити пост{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('posts_bp.post_detail', id=post.id) }}" class="btn btn-secondary">
        ← Назад до поста
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h2>Підтвердження видалення</h2>
    </div>
    <div class="card-body">
        <p>Ви впевнені, що хочете видалити пост <strong>"{{ post.title }}"</strong>?</p>
        <p class="text-muted">Цю дію неможливо скасувати.</p>

        <form method="POST" class="mt-4">
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="{{ url_for('posts_bp.post_detail', id=post.id) }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
