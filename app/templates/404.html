<!DOCTYPE html>
<html lang="uk">

<head>

    <title>Сторінку не знайдено</title>
    <meta http-equiv="refresh" content="3; url=/" />
    <style>
        body {
            background-color: #f3f3f3;
            color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-container {
            text-align: center;
            padding: 2rem 3rem;

        }

        h1 {
            font-size: 5rem;
            margin-bottom: 0.5rem;
            color: #eb5757;
        }

        p {

            margin-top: 0;
        }

        a {
            margin-top: 1rem;
            display: inline-block;
            color: #2d79c7;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>404</h1>
        <p>Ой! Сторінку не знайдено.</p>
        <p>Ви будете перенаправлені на <a href="{{ url_for('main.home') }}">головну сторінку</a> через кілька

</html>
