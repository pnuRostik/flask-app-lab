{% extends "base.html" %}

{% block title %}Greetings Page{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
{% endblock%}
{% block content %}
<div class="container">
    <div class="greeting-container">
        <h2>Hello {{ name }}</h2>
        {% if age %}
        <p>You are {{ age }} years old.</p>
        {% else %}
        <p>Age is unknown.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
