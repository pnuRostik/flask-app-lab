{% extends "base.html" %}

{% block title %}Користувачі{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Список користувачів</h2>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ім'я користувача</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('users_bp.profile') }}" class="btn btn-primary">Повернутися до профілю</a>
    </div>
</div>
{% endblock %}
